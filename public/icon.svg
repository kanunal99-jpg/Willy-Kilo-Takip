<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="willyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.25" />

  <!-- Calorie/Macro Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="24" stroke-linecap="round" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#willyGrad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="800 1200" stroke-dashoffset="-120" filter="url(#glow)" />

  <!-- Willy Character Body (Adorable Monster/Yazio style) -->
  <g transform="translate(0, 15)">
    <!-- Horns/Tufts -->
    <path d="M175 165 C160 120 190 90 220 135 Z" fill="#06b6d4" />
    <path d="M337 165 C352 120 322 90 292 135 Z" fill="#06b6d4" />

    <!-- Head / Main Body -->
    <ellipse cx="256" cy="250" rx="125" ry="110" fill="url(#willyGrad)" />

    <!-- Cute Cheeks -->
    <circle cx="185" cy="275" r="18" fill="#f43f5e" opacity="0.3" />
    <circle cx="327" cy="275" r="18" fill="#f43f5e" opacity="0.3" />

    <!-- Eyes -->
    <circle cx="205" cy="235" r="18" fill="#0f172a" />
    <circle cx="212" cy="228" r="6" fill="#ffffff" />

    <circle cx="307" cy="235" r="18" fill="#0f172a" />
    <circle cx="314" cy="228" r="6" fill="#ffffff" />

    <!-- Happy Smile -->
    <path d="M225 270 Q256 305 287 270" fill="none" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
    <path d="M242 278 Q256 295 270 278" fill="#f43f5e" />

    <!-- Fire badge on head (calorie burn) -->
    <g transform="translate(256, 120) scale(0.9)">
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#334155" stroke-width="3" />
      <path d="M0 16 C-12 16 -16 6 -8 -4 C-12 -12 0 -22 0 -22 C0 -22 12 -12 8 -4 C16 6 12 16 0 16 Z" fill="url(#flameGrad)" />
    </g>
  </g>
</svg>
