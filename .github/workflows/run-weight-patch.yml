name: Run Weight History Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path
          import json

          p = Path('src/components/WeightTab.tsx')
          s = p.read_text()
          s = s.replace("const [inputNote, setInputNote] = useState('');", "const [inputNote, setInputNote] = useState('');\n  const [inputDate, setInputDate] = useState(() => new Date().toISOString().slice(0, 10));\n  const [historyRange, setHistoryRange] = useState<'7d' | '30d' | '1y' | 'all'>('all');")
          s = s.replace("const latestWeight = weightRecords[weightRecords.length - 1]?.weightKg || profile.currentWeightKg;", "const orderedRecords = [...weightRecords].sort((a, b) => a.timestamp - b.timestamp);\n  const latestWeight = orderedRecords[orderedRecords.length - 1]?.weightKg || profile.currentWeightKg;")
          s = s.replace("const handleSaveWeight = () => {\n    const val = parseFloat(inputWeight);\n    if (!val || isNaN(val)) return;", "const handleSaveWeight = () => {\n    const val = parseFloat(inputWeight);\n    if (!val || isNaN(val) || !inputDate) return;\n    const recordDate = new Date(`${inputDate}T12:00:00`);\n    const timestamp = recordDate.getTime();\n    if (!Number.isFinite(timestamp)) return;")
          s = s.replace("date: new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' }),", "date: recordDate.toLocaleDateString('tr-TR', { day: '2-digit', month: '2-digit', year: 'numeric' }),")
          s = s.replace("timestamp: Date.now(),", "timestamp,")
          s = s.replace("setInputNote('');", "setInputNote('');\n    setInputDate(new Date().toISOString().slice(0, 10));")
          s = s.replace("const weights = weightRecords.map((r) => r.weightKg);", "const weights = orderedRecords.map((r) => r.weightKg);")
          s = s.replace("const points = weightRecords.map((rec, i) => {", "const points = orderedRecords.map((rec, i) => {")
          marker = "  const polylineStr = points.map((p) => `${p.x},${p.y}`).join(' ');\n"
          s = s.replace(marker, marker + "\n  const rangeDays = historyRange === '7d' ? 7 : historyRange === '30d' ? 30 : historyRange === '1y' ? 365 : null;\n  const cutoff = rangeDays ? Date.now() - rangeDays * 24 * 60 * 60 * 1000 : 0;\n  const visibleRecords = orderedRecords.filter((r) => !rangeDays || r.timestamp >= cutoff);\n")
          s = s.replace("{weightRecords.length} ölçüm", "{visibleRecords.length} / {weightRecords.length} ölçüm")
          s = s.replace("        {/* Chart SVG */}", """        <div className=\"flex gap-1.5 overflow-x-auto pb-1\">\n          {([['7d', '7 gün'], ['30d', '30 gün'], ['1y', '1 yıl'], ['all', 'Tümü']] as const).map(([key, label]) => (\n            <button key={key} onClick={() => setHistoryRange(key)} className={`px-3 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap ${historyRange === key ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-400'}`}>\n              {label}\n            </button>\n          ))}\n        </div>\n\n        {/* Chart SVG */}""")
          s = s.replace("{[...weightRecords].reverse().map((rec) => (", "{[...visibleRecords].reverse().map((rec) => (")
          date_marker = '''            <div>\n              <label className="text-xs font-semibold text-slate-300 block mb-1">Vücut Yağ Oranı (%)</label>'''
          date_ui = '''            <div>\n              <label className="text-xs font-semibold text-slate-300 block mb-1">Kayıt Tarihi *</label>\n              <input type="date" value={inputDate} max={new Date().toISOString().slice(0, 10)} onChange={(e) => setInputDate(e.target.value)} className="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-sm text-white" />\n              <p className="text-[10px] text-slate-500 mt-1">Geçmiş bir tartımı gerçek tarihiyle kaydedebilirsin.</p>\n            </div>\n\n''' + date_marker
          if date_marker not in s: raise SystemExit('Weight modal marker not found')
          s = s.replace(date_marker, date_ui)
          p.write_text(s)

          p = Path('src/App.tsx')
          s = p.read_text()
          old = """  const handleAddWeight = (record: WeightRecord) => {\n    setWeightRecords((prev) => [...prev, record]);\n    setProfile((prev) => ({\n      ...prev,\n      currentWeightKg: record.weightKg,\n      diamonds: prev.diamonds + 25,\n    }));\n  };\n\n  const handleDeleteWeight = (id: string) => {\n    setWeightRecords((prev) => prev.filter((r) => r.id !== id));\n  };"""
          new = """  const handleAddWeight = (record: WeightRecord) => {\n    setWeightRecords((prev) => {\n      const next = [...prev, record].sort((a, b) => a.timestamp - b.timestamp);\n      const latest = next[next.length - 1];\n      setProfile((profilePrev) => ({ ...profilePrev, currentWeightKg: latest?.weightKg ?? profilePrev.currentWeightKg, diamonds: profilePrev.diamonds + 25 }));\n      return next;\n    });\n  };\n\n  const handleDeleteWeight = (id: string) => {\n    setWeightRecords((prev) => {\n      const next = prev.filter((r) => r.id !== id).sort((a, b) => a.timestamp - b.timestamp);\n      setProfile((profilePrev) => ({ ...profilePrev, currentWeightKg: next[next.length - 1]?.weightKg ?? profilePrev.startingWeightKg }));\n      return next;\n    });\n  };"""
          if old not in s: raise SystemExit('App weight handlers not found')
          p.write_text(s.replace(old, new))

          p = Path('version.json')
          v = json.loads(p.read_text())
          v.update(versionName='1.0.10', versionCode=11, releaseDate='2026-09-06')
          v['releaseNotes'] = [
            'Kilo kayıtları artık gerçek tarih ile geçmişe dönük eklenebilir',
            '7 gün, 30 gün, 1 yıl ve tüm zamanlar kayıt filtreleri eklendi',
            'Kilo geçmişi timestamp sırasına göre kalıcı ve güvenilir tutuluyor',
            'Geçmiş kayıt ekleme/silme sonrası güncel kilo doğru son kayda göre hesaplanıyor',
            *v.get('releaseNotes', []),
          ]
          p.write_text(json.dumps(v, ensure_ascii=False, indent=2) + '\n')

          Path('.github/workflows/patch-weight-history.yml').unlink(missing_ok=True)
          Path('.github/workflows/run-weight-patch.yml').unlink(missing_ok=True)
      - name: Validate
        run: |
          npm install
          npx tsc --noEmit
          npm run build
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/WeightTab.tsx src/App.tsx version.json .github/workflows/patch-weight-history.yml .github/workflows/run-weight-patch.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat(weight): add durable historical weight records and filters'
          git push
