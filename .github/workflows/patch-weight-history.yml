name: Complete Weight History Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'feat(weight): complete historical records') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App handlers and version
        shell: python
        run: |
          from pathlib import Path
          import json
          p = Path('src/App.tsx')
          s = p.read_text()
          old = """  const handleAddWeight = (record: WeightRecord) => {\n    setWeightRecords((prev) => [...prev, record]);\n    setProfile((prev) => ({\n      ...prev,\n      currentWeightKg: record.weightKg,\n      diamonds: prev.diamonds + 25,\n    }));\n  };\n\n  const handleDeleteWeight = (id: string) => {\n    setWeightRecords((prev) => prev.filter((r) => r.id !== id));\n  };"""
          new = """  const handleAddWeight = (record: WeightRecord) => {\n    setWeightRecords((prev) => {\n      const next = [...prev, record].sort((a, b) => a.timestamp - b.timestamp);\n      const latest = next[next.length - 1];\n      setProfile((profilePrev) => ({\n        ...profilePrev,\n        currentWeightKg: latest?.weightKg ?? profilePrev.currentWeightKg,\n        diamonds: profilePrev.diamonds + 25,\n      }));\n      return next;\n    });\n  };\n\n  const handleDeleteWeight = (id: string) => {\n    setWeightRecords((prev) => {\n      const next = prev.filter((r) => r.id !== id).sort((a, b) => a.timestamp - b.timestamp);\n      setProfile((profilePrev) => ({\n        ...profilePrev,\n        currentWeightKg: next[next.length - 1]?.weightKg ?? profilePrev.startingWeightKg,\n      }));\n      return next;\n    });\n  };"""
          if old not in s:
              raise SystemExit('App weight handlers not found; refusing partial patch')
          p.write_text(s.replace(old, new))

          p = Path('version.json')
          v = json.loads(p.read_text())
          v['versionName'] = '1.0.10'
          v['versionCode'] = 11
          v['releaseDate'] = '2026-09-06'
          v['releaseNotes'] = [
            'Kilo kayıtları gerçek tarih ile geçmişe dönük eklenebilir',
            '7 gün, 30 gün, 1 yıl ve tüm zamanlar geçmiş filtreleri eklendi',
            'Kilo geçmişi timestamp sırasına göre kalıcı tutuluyor',
            'Geçmiş kayıt ekleme ve silme sonrası güncel kilo son tarihli kayda göre hesaplanıyor',
            *v.get('releaseNotes', []),
          ]
          p.write_text(json.dumps(v, ensure_ascii=False, indent=2) + '\n')

          Path('.github/workflows/patch-weight-history.yml').unlink()
      - name: Validate
        run: |
          npm install
          npx tsc --noEmit
          npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx version.json .github/workflows/patch-weight-history.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat(weight): complete historical records'
          git push
