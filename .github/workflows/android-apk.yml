name: Android APK & GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate release version contract
        id: version-contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/validate-release-version.mjs
          VERSION=$(node -p "require('./version.json').versionName")
          CODE=$(node -p "require('./version.json').versionCode")
          TAG="v$VERSION"
          git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1 && { echo "ERROR: $TAG already exists"; exit 1; } || true
          LATEST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          if [ -n "$LATEST_TAG" ]; then
            LATEST_B64=$(gh api "repos/${GITHUB_REPOSITORY}/contents/version.json?ref=${LATEST_TAG}" --jq '.content' 2>/dev/null || true)
            if [ -n "$LATEST_B64" ]; then
              echo "$LATEST_B64" | tr -d '\n' | base64 -d > /tmp/latest-version.json
              LATEST_VERSION=$(node -p "require('/tmp/latest-version.json').versionName")
              LATEST_CODE=$(node -p "require('/tmp/latest-version.json').versionCode")
              node -e 'const [v,c,lv,lc]=process.argv.slice(1); const p=x=>x.split(".").map(Number); const a=p(v),b=p(lv); if(!(a[0]>b[0]||(a[0]===b[0]&&(a[1]>b[1]||(a[1]===b[1]&&a[2]>b[2]))))) throw new Error(`Version ${v} must be newer than ${lv}`); if(Number(c)<=Number(lc)) throw new Error(`versionCode ${c} must be > ${lc}`)' "$VERSION" "$CODE" "$LATEST_VERSION" "$LATEST_CODE"
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CODE=$CODE" >> "$GITHUB_OUTPUT"

      - name: TypeScript validation
        run: npm run lint

      - name: Nutrition catalog quality gate
        run: npm run audit:nutrition

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Set Android version
        run: |
          VERSION="${{ steps.version-contract.outputs.VERSION }}"
          CODE="${{ steps.version-contract.outputs.CODE }}"
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -F "versionCode $CODE" android/app/build.gradle
          grep -F "versionName \"$VERSION\"" android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply and verify ML Kit barcode manifest
        run: |
          node scripts/ensure-android-barcode-manifest.mjs
          test "$(grep -Fc 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml)" -ge 1
          test "$(grep -Fc 'com.google.mlkit.vision.DEPENDENCIES' android/app/src/main/AndroidManifest.xml)" -eq 1
          test "$(grep -Fc 'android:value=\"barcode_ui\"' android/app/src/main/AndroidManifest.xml)" -eq 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.WILLY_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WILLY_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WILLY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WILLY_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Configure release signing
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.WILLY_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WILLY_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WILLY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WILLY_RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          raw=re.sub(r'[^A-Za-z0-9+/]','',os.environ['KEYSTORE_B64']); raw += '='*((-len(raw))%4)
          data=base64.b64decode(raw, validate=True)
          Path('willy-release.jks').write_bytes(data)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle'); s=p.read_text()
          if 'signingConfigs {' not in s:
              s=s.replace('android {','android {\n    signingConfigs {\n        release {\n            storeFile file("../willy-release.jks")\n            storeType "PKCS12"\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }\n    }',1)
          if 'signingConfig signingConfigs.release' not in s:
              s,n=re.subn(r'(buildTypes\s*\{\s*release\s*\{)',r'\1\n            signingConfig signingConfigs.release',s,count=1)
              if n != 1: raise SystemExit('release build type not found')
          p.write_text(s)
          PY

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.WILLY_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WILLY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WILLY_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        working-directory: android
        run: |
          SDK_APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$SDK_APKSIGNER"
          "$SDK_APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare and upload APK artifact
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/WillyKiloTakip.apk
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/WillyKiloTakip-v${{ steps.version-contract.outputs.VERSION }}.apk
          rm -f android/willy-release.jks
        
      - uses: actions/upload-artifact@v4
        with:
          name: willy-kilo-takip-apk
          path: release-assets/WillyKiloTakip.apk
          if-no-files-found: error

      - name: Wait for Render production deploy
        run: sleep 120

      - name: Production Gemini four-question smoke
        run: |
          set -euo pipefail
          h=$(curl --fail-with-body --silent --show-error --max-time 30 https://willy-kilo-takip.onrender.com/api/health)
          echo "$h"
          H="$h" python3 - <<'PY'
          import json,os
          d=json.loads(os.environ['H']); assert d.get('aiEnabled') is True; assert (d.get('aiProviders') or {}).get('gemini') is True
          print('PRODUCTION GEMINI READINESS PASS')
          PY
          python3 - <<'PY'
          import json,subprocess,time
          qs=['Kilo vermem neden son haftalarda yavaşladı?','Akşam kavurma ve pilav yersem porsiyonu nasıl ayarlamalıyım?','Protein hedefimi gün içinde pratik olarak nasıl tamamlarım?','Bugün su hedefime ulaşmak için nasıl bir plan yapayım?']
          replies=[]
          for q in qs:
            p=json.dumps({'message':q,'userProfile':{'goal':'lose_weight','currentWeightKg':80,'targetWeightKg':75,'dailyCalorieTarget':2000,'waterTargetMl':2500},'todaySummary':{'consumedCalories':500,'waterMl':750}})
            r=subprocess.run(['curl','--fail-with-body','--silent','--show-error','--max-time','90','-X','POST','https://willy-kilo-takip.onrender.com/api/ai/coach','-H','Content-Type: application/json','--data',p],capture_output=True,text=True,check=True)
            d=json.loads(r.stdout); assert d.get('success') and d.get('reply') and d.get('provider')=='gemini' and d.get('fallback') is False and str(d.get('model','')).startswith('gemini-'), d
            replies.append(d['reply']); print(json.dumps({'question':q,'model':d.get('model'),'provider':d.get('provider'),'fallback':d.get('fallback')},ensure_ascii=False)); time.sleep(4)
          assert len(set(replies))==4
          print('FOUR-QUESTION REAL GEMINI COACH SMOKE PASS')
          PY

      - name: Coach answer quality smoke
        env:
          BASE_URL: https://willy-kilo-takip.onrender.com
        run: node scripts/coach-quality-smoke.mjs

      - name: Production photo analysis Gemini smoke
        run: |
          set -euo pipefail
          p='{"imageBase64":"aGVsbG8=","mimeType":"image/jpeg","description":"ızgara tavuk ve salata","mealType":"lunch"}'
          r=$(curl --fail-with-body --silent --show-error --max-time 90 -X POST https://willy-kilo-takip.onrender.com/api/ai/analyze-food -H 'Content-Type: application/json' --data "$p")
          echo "$r"
          R="$r" python3 - <<'PY'
          import json,os
          d=json.loads(os.environ['R']); assert d.get('success') is True and d.get('provider')=='gemini' and d.get('fallback') is False and d.get('visualAnalyzed') is True, d
          print('PRODUCTION PHOTO GEMINI SMOKE PASS')
          PY

      - name: Barcode and sync safety smoke
        run: |
          set -euo pipefail
          v=$(curl --fail-with-body --silent --show-error --max-time 30 https://willy-kilo-takip.onrender.com/api/barcode/3017624010701)
          echo "$v" | grep -qi Nutella
          s=$(curl --silent --show-error --output /tmp/b.json --write-out '%{http_code}' --max-time 30 https://willy-kilo-takip.onrender.com/api/barcode/123)
          test "$s" = 400
          s=$(curl --silent --show-error --output /tmp/s.json --write-out '%{http_code}' --max-time 30 https://willy-kilo-takip.onrender.com/api/sync/INVALID)
          test "$s" = 400 || test "$s" = 503
          echo 'BARCODE + SYNC SAFETY SMOKE PASS'

      - name: Create GitHub Release LAST
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version-contract.outputs.VERSION }}
          name: Willy Kilo Takip v${{ steps.version-contract.outputs.VERSION }}
          body: |
            ## Willy Kilo Takip v${{ steps.version-contract.outputs.VERSION }}
            - Real Gemini AI coach and food analysis
            - Production coach quality gates passed
            - Android ML Kit barcode chain passed
            - Persistent release signing passed
          files: |
            release-assets/WillyKiloTakip.apk
            release-assets/WillyKiloTakip-v${{ steps.version-contract.outputs.VERSION }}.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
