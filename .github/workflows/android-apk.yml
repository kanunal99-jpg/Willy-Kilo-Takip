name: Android APK & GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Extract version info
        id: version
        run: |
          VERSION=$(node -p "require('./version.json').versionName || '1.0.1'")
          CODE=$(node -p "require('./version.json').versionCode || 2")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CODE=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building Willy Kilo Takip version $VERSION (code: $CODE)"
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Production updates require a persistent signing identity. The keystore is
      # supplied through GitHub Actions secrets and is never committed to the repo.
      - name: Validate release signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.WILLY_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WILLY_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WILLY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WILLY_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing WILLY_RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing WILLY_RELEASE_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing WILLY_RELEASE_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing WILLY_RELEASE_KEY_PASSWORD"; exit 1; }

      - name: Configure release signing
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.WILLY_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WILLY_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WILLY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WILLY_RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > willy-release.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          signing = '''\n    signingConfigs {\n        release {\n            storeFile file("../willy-release.jks")\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }\n    }\n'''
          if 'signingConfigs {' not in s:
              s = s.replace('android {', 'android {' + signing, 1)
          if 'signingConfig signingConfigs.release' not in s:
              s = s.replace('buildTypes {', 'buildTypes {', 1)
              s = s.replace('release {', 'release {\n            signingConfig signingConfigs.release', 1)
          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.WILLY_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WILLY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WILLY_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK outputs
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/WillyKiloTakip.apk
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/WillyKiloTakip-v${{ steps.version.outputs.VERSION }}.apk
          rm -f android/willy-release.jks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: willy-kilo-takip-apk
          path: release-assets/WillyKiloTakip.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Willy Kilo Takip v${{ steps.version.outputs.VERSION }}
          body: |
            ## 🐾 Willy Kilo Takip v${{ steps.version.outputs.VERSION }}

            ### ✨ Yenilikler ve Güncellemeler:
            - 🤖 Gerçek Gemini AI Willy Koç & Yemek Analizi
            - 🔄 Canlı OTA Güncelleme Sistemi
            - 📱 PWA & Offline-First
            - 🔐 Kalıcı release imzası ile güvenli Android güncelleme zinciri
            - ⚡ TypeScript doğrulaması ve performans iyileştirmeleri

            **İndirme:** `WillyKiloTakip.apk`
          files: |
            release-assets/WillyKiloTakip.apk
            release-assets/WillyKiloTakip-v${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
