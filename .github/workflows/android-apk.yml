name: Android APK & GitHub Release

# Canonical release pipeline: version.json -> validation -> APK -> unique release -> production smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate release version contract
        id: version-contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/validate-release-version.mjs
          VERSION=$(node -p "require('./version.json').versionName")
          CODE=$(node -p "require('./version.json').versionCode")
          TAG="v$VERSION"

          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "ERROR: release tag $TAG already exists. Refusing to overwrite an existing version."
            exit 1
          fi

          LATEST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          if [ -n "$LATEST_TAG" ]; then
            LATEST_B64=$(gh api "repos/${GITHUB_REPOSITORY}/contents/version.json?ref=${LATEST_TAG}" --jq '.content' 2>/dev/null || true)
            if [ -n "$LATEST_B64" ]; then
              echo "$LATEST_B64" | tr -d '\n' | base64 -d > /tmp/latest-version.json
              LATEST_VERSION=$(node -p "require('/tmp/latest-version.json').versionName")
              LATEST_CODE=$(node -p "require('/tmp/latest-version.json').versionCode")
              node -e 'const [version,code,latestVersion,latestCode]=process.argv.slice(1); const parts=v=>v.split(".").map(Number); const a=parts(version),b=parts(latestVersion); const newer=a[0]>b[0]||(a[0]===b[0]&&(a[1]>b[1]||(a[1]===b[1]&&a[2]>b[2]))); if(!newer) throw new Error(`Version ${version} must be newer than latest release ${latestVersion}`); if(Number(code)<=Number(latestCode)) throw new Error(`versionCode ${code} must be greater than latest release code ${latestCode}`);' "$VERSION" "$CODE" "$LATEST_VERSION" "$LATEST_CODE"
              echo "Release monotonicity PASS: $TAG code=$CODE > $LATEST_TAG code=$LATEST_CODE"
            fi
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CODE=$CODE" >> "$GITHUB_OUTPUT"
          echo "Release version contract PASS: $TAG (code: $CODE)"

      - name: TypeScript validation
        run: npm run lint

      - name: Nutrition catalog quality gate
        run: npm run audit:nutrition

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Extract version info
        id: version
        run: |
          VERSION="${{ steps.version-contract.outputs.VERSION }}"
          CODE="${{ steps.version-contract.outputs.CODE }}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CODE=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building Willy Kilo Takip version $VERSION (code: $CODE)"
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -F "versionCode $CODE" android/app/build.gradle
          grep -F "versionName \"$VERSION\"" android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply ML Kit barcode Android manifest
        run: node scripts/ensure-android-barcode-manifest.mjs

      - name: Verify ML Kit barcode Android manifest
        run: |
          test "$(grep -Fc 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml)" -ge 1
          test "$(grep -Fc 'com.google.mlkit.vision.DEPENDENCIES' android/app/src/main/AndroidManifest.xml)" -eq 1
          test "$(grep -Fc 'android:value=\"barcode_ui\"' android/app/src/main/AndroidManifest.xml)" -eq 1
          echo "ML Kit barcode manifest verification PASS"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.WILLY_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WILLY_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WILLY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WILLY_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ERROR: WILLY_RELEASE_KEYSTORE_BASE64 is not configured."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ERROR: WILLY_RELEASE_KEYSTORE_PASSWORD is not configured."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: WILLY_RELEASE_KEY_ALIAS is not configured."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: WILLY_RELEASE_KEY_PASSWORD is not configured."; exit 1; }

      - name: Configure persistent release signing
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.WILLY_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WILLY_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WILLY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WILLY_RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          raw = os.environ['KEYSTORE_B64']
          clean = re.sub(r'[^A-Za-z0-9+/]', '', raw)
          clean += '=' * ((-len(clean)) % 4)
          try: data = base64.b64decode(clean, validate=True)
          except Exception as exc: raise SystemExit(f'ERROR: invalid Base64: {exc}')
          if not data: raise SystemExit('ERROR: decoded keystore is empty')
          Path('willy-release.jks').write_bytes(data)
          PY
          openssl pkcs12 -in willy-release.jks -passin env:KEYSTORE_PASSWORD -noout >/dev/null 2>&1 || { echo "ERROR: invalid PKCS12 keystore or password."; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle'); s=p.read_text()
          signing='''\n    signingConfigs {\n        release {\n            storeFile file("../willy-release.jks")\n            storeType "PKCS12"\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }\n    }\n'''
          if 'signingConfigs {' not in s: s=s.replace('android {','android {'+signing,1)
          if 'signingConfig signingConfigs.release' not in s:
              s,count=re.subn(r'(buildTypes\s*\{\s*release\s*\{)',r'\1\n            signingConfig signingConfigs.release',s,count=1)
              if count!=1: raise SystemExit('Could not locate buildTypes.release')
          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.WILLY_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WILLY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WILLY_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        working-directory: android
        run: |
          SDK_APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$SDK_APKSIGNER" || { echo "ERROR: apksigner not found"; exit 1; }
          "$SDK_APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK outputs
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/WillyKiloTakip.apk
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/WillyKiloTakip-v${{ steps.version.outputs.VERSION }}.apk
          rm -f android/willy-release.jks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: willy-kilo-takip-apk
          path: release-assets/WillyKiloTakip.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Willy Kilo Takip v${{ steps.version.outputs.VERSION }}
          body: |
            ## 🐾 Willy Kilo Takip v${{ steps.version.outputs.VERSION }}
            ### ✨ Yenilikler ve Güncellemeler:
            - 🤖 Gerçek Gemini AI Willy Koç & Yemek Analizi
            - 🔄 Canlı OTA Güncelleme Sistemi
            - 📱 PWA & Offline-First
            - 🔐 Kalıcı release imzası ile güvenli Android güncelleme zinciri
            - 📷 ML Kit gerçek kamera barkod tarama zinciri
            - 🥤 10.000+ alkolsüz içecek varyantı, butonlu miktar/hedef/kalori/süre filtreleri
            - ⚡ TypeScript doğrulaması ve performans iyileştirmeleri
            **İndirme:** `WillyKiloTakip.apk`
          files: |
            release-assets/WillyKiloTakip.apk
            release-assets/WillyKiloTakip-v${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Wait for Render production deploy
        if: github.ref == 'refs/heads/main'
        run: sleep 120

      - name: Production Gemini AI smoke test
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          payload='{"message":"Kısa bir selam ver ve bugün su tüketimi için tek bir uygulanabilir öneri yaz.","userProfile":{"name":"SmokeTest","goal":"lose_weight","currentWeightKg":80,"targetWeightKg":75,"dailyCalorieTarget":2000,"waterTargetMl":2000},"todaySummary":{"consumedCalories":500,"burnedCalories":0,"waterMl":500,"fastingActive":false}}'
          response=$(curl --fail-with-body --silent --show-error --max-time 90 -X POST 'https://willy-kilo-takip.onrender.com/api/ai/coach' -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$payload")
          echo "$response"
          node -e 'const r=JSON.parse(process.argv[1]); if (!r.success || !r.reply || !r.model) { console.error("AI smoke test failed", r); process.exit(1) } console.log(`AI smoke test PASS model=${r.model}`)' "$response"
