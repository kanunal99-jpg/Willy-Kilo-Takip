name: Android APK & GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript validation
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Extract version info
        id: version
        run: |
          VERSION=$(node -p "require('./version.json').versionName || '1.0.1'")
          CODE=$(node -p "require('./version.json').versionCode || 2")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CODE=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building Willy Kilo Takip version $VERSION (code: $CODE)"
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply ML Kit barcode Android manifest
        run: node scripts/ensure-android-barcode-manifest.mjs

      - name: Verify ML Kit barcode Android manifest
        run: |
          test "$(grep -Fc 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml)" -ge 1
          test "$(grep -Fc 'com.google.mlkit.vision.DEPENDENCIES' android/app/src/main/AndroidManifest.xml)" -eq 1
          test "$(grep -Fc 'android:value="barcode_ui"' android/app/src/main/AndroidManifest.xml)" -eq 1
          echo "ML Kit barcode manifest verification PASS"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.WILLY_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WILLY_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WILLY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WILLY_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ERROR: WILLY_RELEASE_KEYSTORE_BASE64 is not configured."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ERROR: WILLY_RELEASE_KEYSTORE_PASSWORD is not configured."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: WILLY_RELEASE_KEY_ALIAS is not configured."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: WILLY_RELEASE_KEY_PASSWORD is not configured."; exit 1; }

      - name: Configure persistent release signing
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.WILLY_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WILLY_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WILLY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WILLY_RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path
          raw = os.environ['KEYSTORE_B64']
          clean = re.sub(r'[^A-Za-z0-9+/]', '', raw)
          clean += '=' * ((-len(clean)) % 4)
          try:
              data = base64.b64decode(clean, validate=True)
          except Exception as exc:
              raise SystemExit(f'ERROR: WILLY_RELEASE_KEYSTORE_BASE64 is not valid Base64: {exc}')
          if not data:
              raise SystemExit('ERROR: decoded keystore is empty')
          Path('willy-release.jks').write_bytes(data)
          PY
          openssl pkcs12 -in willy-release.jks -passin env:KEYSTORE_PASSWORD -noout >/dev/null 2>&1 || {
            echo "ERROR: decoded keystore is not a valid PKCS12 keystore or the password is incorrect."; exit 1;
          }
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/build.gradle')
          s = p.read_text()
          signing = '''\n    signingConfigs {\n        release {\n            storeFile file("../willy-release.jks")\n            storeType "PKCS12"\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }\n    }\n'''
          if 'signingConfigs {' not in s:
              s = s.replace('android {', 'android {' + signing, 1)
          if 'signingConfig signingConfigs.release' not in s:
              s, count = re.subn(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
              if count != 1:
                  raise SystemExit('Could not locate android buildTypes.release block')
          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.WILLY_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WILLY_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WILLY_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        working-directory: android
        run: |
          SDK_APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -x "$SDK_APKSIGNER" || { echo "ERROR: apksigner not found"; exit 1; }
          "$SDK_APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK outputs
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/WillyKiloTakip.apk
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/WillyKiloTakip-v${{ steps.version.outputs.VERSION }}.apk
          rm -f android/willy-release.jks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: willy-kilo-takip-apk
          path: release-assets/WillyKiloTakip.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Willy Kilo Takip v${{ steps.version.outputs.VERSION }}
          body: |
            ## 🐾 Willy Kilo Takip v${{ steps.version.outputs.VERSION }}
            ### ✨ Yenilikler ve Güncellemeler:
            - 🤖 Gerçek Gemini AI Willy Koç & Yemek Analizi
            - 🔄 Canlı OTA Güncelleme Sistemi
            - 📱 PWA & Offline-First
            - 🔐 Kalıcı release imzası ile güvenli Android güncelleme zinciri
            - 📷 ML Kit gerçek kamera barkod tarama zinciri
            - ⚡ TypeScript doğrulaması ve performans iyileştirmeleri
            **İndirme:** `WillyKiloTakip.apk`
          files: |
            release-assets/WillyKiloTakip.apk
            release-assets/WillyKiloTakip-v${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for Render production deploy
        if: github.ref == 'refs/heads/main'
        run: sleep 120

      - name: Production Gemini AI smoke test
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -euo pipefail
          payload='{"message":"Kısa bir selam ver ve bugün su tüketimi için tek bir uygulanabilir öneri yaz.","userProfile":{"name":"SmokeTest","goal":"lose_weight","currentWeightKg":80,"targetWeightKg":75,"dailyCalorieTarget":2000,"waterTargetMl":2000},"todaySummary":{"consumedCalories":500,"burnedCalories":0,"waterMl":500,"fastingActive":false}}'
          response=$(curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST 'https://willy-kilo-takip.onrender.com/api/ai/coach' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data "$payload")
          echo "$response"
          node -e 'const r=JSON.parse(process.argv[1]); if (!r.success || !r.reply || !r.model) { console.error("AI smoke test failed", r); process.exit(1) } console.log(`AI smoke test PASS model=${r.model}`)' "$response"
