name: Coach Quality Smoke

on:
  workflow_run:
    workflows: ["Production AI Smoke Tests"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: coach-quality-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  coach-quality-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Wait for exact Render deployment
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          BASE_URL: https://willy-kilo-takip.onrender.com
        run: |
          set -euo pipefail
          for i in {1..30}; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$BASE_URL/api/health" || true)
            echo "health HTTP=$code"
            cat /tmp/health.json || true
            deployed=$(node -e "try { const j=require('/tmp/health.json'); process.stdout.write(String(j.deployCommit||'')); } catch (_) {}")
            echo "expected=$EXPECTED_COMMIT deployed=$deployed"
            if [ "$code" = "200" ] && [ "${deployed,,}" = "${EXPECTED_COMMIT,,}" ]; then
              echo 'EXACT RENDER COMMIT READY'
              exit 0
            fi
            sleep 10
          done
          echo 'Render did not become healthy on the exact GitHub commit in time'
          exit 1

      - name: Run multi-intent real Gemini coach quality gate
        env:
          BASE_URL: https://willy-kilo-takip.onrender.com
        run: node scripts/coach-quality-smoke.mjs
