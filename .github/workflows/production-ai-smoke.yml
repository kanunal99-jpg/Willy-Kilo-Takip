name: Production AI Smoke Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  production-ai-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deployment
        run: sleep 120

      - name: Test production health
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 'https://willy-kilo-takip.onrender.com/api/health'

      - name: Test four different coach questions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          questions = [
              'Kilo vermem neden son haftalarda yavaşladı?',
              'Akşam kavurma ve pilav yersem porsiyonu nasıl ayarlamalıyım?',
              'Protein hedefimi gün içinde pratik olarak nasıl tamamlarım?',
              'Bugün su hedefime ulaşmak için nasıl bir plan yapayım?'
          ]
          replies = []
          for q in questions:
              payload = json.dumps({'message': q, 'userProfile': {'name':'SmokeTest','goal':'lose_weight','currentWeightKg':80,'targetWeightKg':75,'dailyCalorieTarget':2000,'waterTargetMl':2500}, 'todaySummary': {'consumedCalories':500,'burnedCalories':0,'waterMl':750,'fastingActive':False}}, ensure_ascii=False)
              result = subprocess.run(['curl','--fail-with-body','--silent','--show-error','--max-time','90','-X','POST','https://willy-kilo-takip.onrender.com/api/ai/coach','-H','Content-Type: application/json','--data',payload], capture_output=True, text=True, check=True)
              data = json.loads(result.stdout)
              assert data.get('success') and data.get('reply'), data
              replies.append(data['reply'])
              print(json.dumps({'question':q,'provider':data.get('provider'),'model':data.get('model'),'fallback':data.get('fallback'),'reply':data['reply']}, ensure_ascii=False))
          if len(set(replies)) < 4:
              raise SystemExit('FAIL: different coach questions produced duplicate replies')
          print('FOUR-QUESTION COACH SMOKE PASS')
          PY

      - name: Test production photo analysis fallback
        run: |
          set -euo pipefail
          IMAGE_B64='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII='
          payload=$(printf '{"imageBase64":"%s","mimeType":"image/png","description":"","mealType":"lunch"}' "$IMAGE_B64")
          response=$(curl --fail-with-body --silent --show-error --max-time 90 -X POST 'https://willy-kilo-takip.onrender.com/api/ai/analyze-food' -H 'Content-Type: application/json' --data "$payload")
          echo "$response"
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          r=json.loads(os.environ['RESPONSE'])
          assert r.get('success') and r.get('data'), r
          assert 'visualAnalyzed' in r, r
          if r.get('provider') == 'local':
              assert r.get('visualAnalyzed') is False, r
              assert r.get('warning'), r
          elif r.get('provider') == 'gemini':
              assert r.get('visualAnalyzed') is True, r
          else:
              raise SystemExit(f'Unexpected provider: {r.get("provider")}')
          print(f'PHOTO SMOKE PASS provider={r.get("provider")} visualAnalyzed={r.get("visualAnalyzed")}')
          PY

      - name: Test packaged product barcode lookup
        run: |
          set -euo pipefail
          base='https://willy-kilo-takip.onrender.com'
          known=$(curl --fail-with-body --silent --show-error --max-time 30 "$base/api/products/barcode/3017624010701")
          echo "$known"
          KNOWN="$known" python3 - <<'PY'
          import json, os
          d=json.loads(os.environ['KNOWN'])
          assert d.get('success') is True and d.get('found') is True, d
          assert d.get('source') == 'local-catalog', d
          assert d.get('data'), d
          print('KNOWN BARCODE SMOKE PASS')
          PY
          status=$(curl --silent --show-error --max-time 30 --output /tmp/invalid-barcode.json --write-out '%{http_code}' "$base/api/products/barcode/123")
          test "$status" = 400
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/invalid-barcode.json'))
          assert d.get('success') is False and d.get('code') == 'INVALID_BARCODE', d
          print('INVALID BARCODE SMOKE PASS')
          PY

      - name: Test sync persistence safety guard
        run: |
          set -euo pipefail
          base='https://willy-kilo-takip.onrender.com'
          status=$(curl --silent --show-error --max-time 30 --output /tmp/sync-smoke.json --write-out '%{http_code}' "$base/api/sync/WILLY-123456")
          echo "sync status=$status"
          test "$status" = 503
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/sync-smoke.json'))
          assert d.get('code') == 'SYNC_PERSISTENCE_UNAVAILABLE', d
          print('SYNC PERSISTENCE GUARD SMOKE PASS')
          PY
